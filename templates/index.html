<!DOCTYPE html>
<html>
<head>
    <title>IGNI-15 V9.5.9 - INTERFACE DO LIMIAR</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; text-align: center; }
        input, button { padding: 10px; margin: 5px; background: #111; color: #00ff00; border: 1px solid #00ff00; width: 250px; }
        button { cursor: pointer; width: 200px; }
    </style>
</head>
<body>
    <h1>IGNI-15 V9.5.9 - INTERFACE DO LIMIAR</h1>
    
    <h3>Criar Transação</h3>
    <form action="/transaction" method="POST">
        <input type="text" name="sender" placeholder="Sender" required><br>
        <input type="text" name="recipient" placeholder="Recipient" required><br>
        <input type="number" name="amount" placeholder="Amount" step="any" required><br>
        <button type="submit">Enviar Transação</button>
    </form>
    
    <br>
    <form action="/mine" method="GET"><button>MINERAR</button></form>
    <form action="/chain" method="GET"><button>VER CHAIN</button></form>
    <form action="/valid" method="GET"><button>VERIFICAR CHAIN</button></form>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNI-15 V12.0.0 SUPREMA</title>
<style>
    /* IGNI-15 THEME MILITAR */
    body {
        background: #000000;
        color: #FFD700;
        font-family: 'Courier New', monospace;
        font-size: 18px; /* FONTE MAIOR */
        letter-spacing: 1.2px;
        font-weight: bold;
        margin: 20px;
        overflow-x: hidden;
    }

    h1 {
        font-size: 32px; /* TÍTULO GRANDE */
        text-shadow: 0 0 15px #FFD700;
        text-align: center;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 22px;
        border-bottom: 2px solid #FFD700;
        padding-bottom: 5px;
        margin-top: 30px;
    }

    .card {
        background: #111;
        border: 1px solid #FFD700;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    button {
        font-size: 16px;
        font-weight: bold;
        padding: 12px 20px;
        background: #FFD700;
        color: #000;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
        transition: 0.3s;
    }

    button:hover {
        box-shadow: 0 0 20px #FFD700;
        transform: scale(1.05);
    }

    input {
        font-size: 16px;
        padding: 10px;
        background: #222;
        color: #FFD700;
        border: 1px solid #FFD700;
        border-radius: 5px;
        font-family: 'Courier New', monospace;
    }

    /* MOEDAS 3D CAINDO */
    .moeda {
        position: fixed;
        top: -50px;
        width: 40px;
        height: 40px;
        background: radial-gradient(circle at 30% 30%, #FFD700, #B8860B);
        border-radius: 50%;
        box-shadow: 0 0 15px #FFD700, inset 0 0 10px rgba(0,0,0,0.4);
        animation: cair linear forwards;
        z-index: 9999;
        transform-style: preserve-3d;
    }

    @keyframes cair {
        0% { transform: translateY(-50px) rotateY(0deg) rotateX(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotateY(720deg) rotateX(360deg); opacity: 0; }
    }
</style>
</head>
<body>

<h1>IGNI-15 V12.0.0 SUPREMA</h1>

<div class="card">
    <h2>Saldos da Rede</h2>
    <p>Alice: 1000 IGNI</p>
    <p>Bob: 1000 IGNI</p>
    <p>Comandante: 10000 IGNI</p>
</div>

<div class="card">
    <h2>Criar Transação</h2>
    <input type="text" placeholder="Destinatário">
    <input type="number" placeholder="Quantidade">
    <button onclick="soltarMoedas()">ENVIAR IGNI</button>
</div>

<div class="card">
    <h2>Controle da Chain</h2>
    <button onclick="soltarMoedas()">MINERAR BLOCO</button>
    <button>VER CHAIN COMPLETA</button>
    <button>VERIFICAR VALIDADE</button>
</div>

<script>
    // FUNÇÃO PARA SOLTAR MOEDAS 3D
    function criarMoeda() {
        const moeda = document.createElement('div');
        moeda.classList.add('moeda');
        moeda.style.left = Math.random() * window.innerWidth + 'px';
        moeda.style.animationDuration = 3 + Math.random() * 3 + 's';
        document.body.appendChild(moeda);
        
        setTimeout(() => {
            moeda.remove();
        }, 6000);
    }

    function soltarMoedas() {
        // Solta 20 moedas de uma vez
        for(let i = 0; i < 20; i++) {
            setTimeout(criarMoeda, i * 100);
        }
    }

    // Chuva de moedas leve o tempo todo
    setInterval(criarMoeda, 500);
</script>

</body>
</html>
